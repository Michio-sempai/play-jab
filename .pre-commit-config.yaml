repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: wemake-python-styleguide
        additional_dependencies:
          - wemake-python-styleguide==1.7.1
        args:
          - --select=WPS
        files: ^src/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [src]
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy-tests
        name: mypy (tests, indicator)
        # AGENTS.md requires only `mypy src`; this is an indicator pass for the
        # whole test suite, unit and integration (unit-tests-review.md finding
        # B-8). Runs via `uv run` rather than the mirrors-mypy hook's isolated
        # environment because tests import pytest and play_jab itself, neither
        # of which that environment has installed.
        entry: uv run mypy tests
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
