[project]
name = "play-jab"
version = "2026.08.8"
description = "Playwright-style automation API for Java apps via Java Access Bridge (JAB)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Michio Kim", email = "dashanovsd@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["gui", "automation", "testing", "accessibility", "rpa"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
play-jab-skill = "play_jab._skill.cli:main"

[project.urls]
Homepage = "https://gitlab.com/dashanovsd/play-jab"
Repository = "https://gitlab.com/dashanovsd/play-jab"
Issues = "https://gitlab.com/dashanovsd/play-jab/-/issues"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff",
    "mypy",
    "flake8",
    "wemake-python-styleguide",
    "codespell",
    "import-linter",
    "pre-commit",
    "commitizen",
    "bumpver",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
external = ["WPS"]
select = [
    "A",             # flake8-builtins
    "ASYNC",         # flake8-async
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (import sorting)
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "DTZ",           # flake8-datetimez
    "ERA",           # eradicate commented-out code
    "EXE",           # flake8-executable
    "FLY",           # flynt-style string joins
    "FURB",          # refurb modernizations
    "G",             # flake8-logging-format
    "ICN",           # flake8-import-conventions
    "LOG",           # flake8-logging
    "PERF",          # perflint
    "PIE",           # flake8-pie
    "PT",            # flake8-pytest-style
    "PTH",           # flake8-use-pathlib
    "SIM",           # flake8-simplify
    "RET",           # flake8-return
    "RSE",           # flake8-raise
    "S",             # flake8-bandit
    "SLOT",          # flake8-slots
    "T100",          # flake8-debugger
    "TID",           # flake8-tidy-imports
    "YTT",           # flake8-2020
    "PL",            # pylint
    "RUF",           # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/integration/conftest.py" = ["S603"]
"tests/integration/test_jab_runtime.py" = ["S603"]
"tests/test_locator_contract.py" = ["S105"]
"tests/test_native_errors.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
extra_checks = true
strict_equality_for_none = true
python_version = "3.11"
platform = "win32"
packages = ["play_jab"]
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# What to measure is declared once, in [tool.coverage.run] source below - not
# repeated here as `--cov=play_jab`, which used to trigger coverage's
# "Module was previously imported, but not measured" warning.
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]
timeout = 30
timeout_method = "thread"
markers = [
    "integration_jab: opt-in tests requiring Windows, a JDK 17 fixture, and Java Access Bridge",
]

[tool.coverage.run]
source = ["src/play_jab"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# Linux CI skips the Windows ABI, DLL, and adapter tests and starts near 81%;
# keep the cross-platform gate just below that baseline. Windows development
# runs remain near 90% and report their exact value.
fail_under = 80.5
precision = 2
show_missing = true
skip_covered = true

[tool.codespell]
builtin = "clear,rare,code"
ignore-words-list = "lets,te,uint,uis"
quiet-level = 2
skip = ".git,.mypy_cache,.pytest_cache,.ruff_cache,.uv-cache,.venv,build,dist,htmlcov,*.lock,*.jar"

# Commitizen only lints commit messages (Conventional Commits) and can generate the
# changelog from them. Actual version bumping is calendar-based and handled by bumpver
# below, not by `cz bump` (commit-type driven semver bumping doesn't fit CalVer).
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
ignored_tag_formats = ["ai_version"]

# Calendar versioning: YYYY.MM.PATCH[PYTAGNUM], e.g. 2026.08.0, 2026.08.1, 2026.09.0.
# PATCH resets to 0 whenever YYYY.MM changes and otherwise only bumps when explicitly
# asked (`uv run bumpver update --patch`, see README) - it does not auto-increment on
# every invocation. PYTAGNUM (optional, in brackets) is a PEP 440 pre/post/dev release
# tag glued to its number with no separator (a0, b1, rc2, post0, dev3); pass it via
# `--tag=alpha|beta|rc|dev|post|final` (+ `--tag-num` to bump the number).
[tool.bumpver]
current_version = "2026.08.8"
version_pattern = "YYYY.0M.PATCH[PYTAGNUM]"
commit_message = "bump version to {new_version}"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"',
    '^current_version = "{version}"',
]
