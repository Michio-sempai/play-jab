[project]
name = "play-jab"
version = "2026.08.2"
description = "Playwright-style automation API for Java apps via Java Access Bridge (JAB)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Michio Kim", email = "dashanovsd@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["gui", "automation", "testing", "accessibility", "rpa"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gitlab.com/dashanovsd/play-jab"
Repository = "https://gitlab.com/dashanovsd/play-jab"
Issues = "https://gitlab.com/dashanovsd/play-jab/-/issues"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff",
    "mypy",
    "flake8",
    "wemake-python-styleguide",
    "pre-commit",
    "commitizen",
    "bumpver",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (import sorting)
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "RET",           # flake8-return
    "PL",            # pylint
    "RUF",           # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
platform = "win32"
packages = ["play_jab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=play_jab --cov-report=term-missing"
markers = [
    "integration_jab: opt-in tests requiring Windows, a JDK 17 fixture, and Java Access Bridge",
]

[tool.coverage.run]
source = ["src/play_jab"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# Commitizen only lints commit messages (Conventional Commits) and can generate the
# changelog from them. Actual version bumping is calendar-based and handled by bumpver
# below, not by `cz bump` (commit-type driven semver bumping doesn't fit CalVer).
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
ignored_tag_formats = ["ai_version"]

# Calendar versioning: YYYY.MM.PATCH[PYTAGNUM], e.g. 2026.08.0, 2026.08.1, 2026.09.0.
# PATCH resets to 0 whenever YYYY.MM changes and otherwise only bumps when explicitly
# asked (`uv run bumpver update --patch`, see README) - it does not auto-increment on
# every invocation. PYTAGNUM (optional, in brackets) is a PEP 440 pre/post/dev release
# tag glued to its number with no separator (a0, b1, rc2, post0, dev3); pass it via
# `--tag=alpha|beta|rc|dev|post|final` (+ `--tag-num` to bump the number).
[tool.bumpver]
current_version = "2026.08.2"
version_pattern = "YYYY.0M.PATCH[PYTAGNUM]"
commit_message = "bump version to {new_version}"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"',
    '^current_version = "{version}"',
]
