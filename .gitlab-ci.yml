# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - security
  - build
  - release

variables:
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  UV_LINK_MODE: copy

.uv-image:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim

.uv-cache:
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv

ruff:
  extends: [.uv-image, .uv-cache]
  stage: lint
  script:
    - uv run --group lint ruff check .
    - uv run --group lint ruff format --check .

flake8-wps:
  extends: [.uv-image, .uv-cache]
  stage: lint
  script:
    - uv run --group lint flake8 src --select=WPS

mypy:
  extends: [.uv-image, .uv-cache]
  stage: lint
  script:
    - uv run --group lint mypy src

commitizen-check:
  extends: [.uv-image, .uv-cache]
  stage: lint
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - uv run --group lint cz check --rev-range "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..HEAD"

test:
  extends: [.uv-cache]
  stage: test
  image: "ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  script:
    # Real JAB tests need an interactive Windows desktop and remain local-only.
    - >-
      uv run --python "$PYTHON_VERSION" --group test pytest
      --ignore=tests/integration
      --cov-report=xml --junitxml=junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sast:
  stage: security

secret_detection:
  stage: security

build:
  extends: [.uv-image, .uv-cache]
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/

# Publishes to PyPI via Trusted Publishing (OIDC) - no long-lived token stored in CI.
# One-time setup required on pypi.org: add a Trusted Publisher for this project with
# GitLab as the provider (namespace/project/workflow filepath = this .gitlab-ci.yml).
release:
  extends: [.uv-image, .uv-cache]
  stage: release
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+((a|b|rc|post|dev)[0-9]+)?$/'
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - |
      PACKAGE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
      test "$CI_COMMIT_TAG" = "v$PACKAGE_VERSION"
      grep -Fq "## v$PACKAGE_VERSION (" CHANGELOG.md
    - |
      cat > mint_token.py <<'PY'
      import json
      import os
      import urllib.request

      req = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
          method="POST",
      )
      with urllib.request.urlopen(req) as resp:
          print(json.load(resp)["token"])
      PY
      export UV_PUBLISH_TOKEN=$(python3 mint_token.py)
      uv publish
