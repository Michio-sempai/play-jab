[flake8]
# flake8 itself doesn't read pyproject.toml; ruff already covers E/F/W/pyflakes/pycodestyle,
# so this config keeps only wemake-python-styleguide's own checks (WPS) as a supplemental pass.
select = WPS
max-line-length = 88
max-complexity = 6
show-source = True
statistics = False

# WPS remains useful for implementation-level smells, but these rules conflict
# with deliberate project conventions: Java/Win32 ABI names, ctypes metadata,
# explicit public exports, cohesive native protocols, and exception-safe cleanup.
extend-ignore =
    WPS110,
    WPS111,
    WPS114,
    WPS120,
    WPS202,
    WPS214,
    WPS229,
    WPS230,
    WPS338,
    WPS339,
    WPS410,
    WPS412,
    WPS430,
    WPS501,
    WPS505

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    .mypy_cache,
    .ruff_cache,
    .pytest_cache
