[flake8]
# flake8 itself doesn't read pyproject.toml; ruff already covers E/F/W/pyflakes/pycodestyle,
# so this config keeps only wemake-python-styleguide's own checks (WPS) as a supplemental pass.
select = WPS
max-line-length = 88
max-complexity = 6
show-source = True
statistics = False

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    .mypy_cache,
    .ruff_cache,
    .pytest_cache

per-file-ignores =
    tests/*.py: WPS226, WPS432, WPS201, WPS118
